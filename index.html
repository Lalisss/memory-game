<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>เกมจับคู่ความทรงจำ</title>
  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #fff0f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #d63384;
    }
    #game {
      display: grid;
      grid-template-columns: repeat(4, 100px);
      grid-gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }
    .card {
      background-color: #ffe6ec;
      border-radius: 12px;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      border-radius: 12px;
    }
    .card.flipped img {
      display: block;
    }
    .card.matched {
      opacity: 0.6;
      pointer-events: none;
    }
    #message {
      margin-top: 20px;
      font-size: 1.4rem;
      color: #d63384;
    }
    button {
      margin-top: 20px;
      padding: 0.8rem 1.5rem;
      border: none;
      background-color: #ff8fa3;
      color: white;
      font-size: 1rem;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover {
      background-color: #ff6f91;
    }
  </style>
</head>
<body>

  <h1>เกมจับคู่ความทรงจำ</h1>
  <div id="game"></div>
  <div id="message"></div>
  <button onclick="startGame()">เริ่มใหม่</button>

  <script>
    const memoryItems = [
      '1.png','1.png',
      '2.png','2.png',
      '3.png','3.png',
      '4.png','4.png',
      '5.png','5.png',
      '6.png','6.png',
      '7.png','7.png',
      '8.png','8.png',
      '9.png','9.png',
      '10.png','10.png',
      '11.png','11.png',
      '12.png','12.png',
      '13.png','13.png',
      '14.png','14.png',
      'image.png','image.png',
      'image (1).png','image (1).png',
      'screenshot.png','screenshot.png'
    ];

    let flippedCards = [];
    let matchedCount = 0;

    function startGame() {
      const shuffled = [...memoryItems].sort(() => 0.5 - Math.random());
      const game = document.getElementById('game');
      game.innerHTML = '';
      document.getElementById('message').textContent = '';
      matchedCount = 0;

      shuffled.forEach((item) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.value = item;

        const img = document.createElement('img');
        img.src = `photo%20by%20Gluay/${item}`; // path รูปของคุณ
        card.appendChild(img);

        card.addEventListener('click', () => handleCardClick(card));
        game.appendChild(card);
      });
    }

    function handleCardClick(card) {
      if (
        card.classList.contains('flipped') ||
        card.classList.contains('matched') ||
        flippedCards.length >= 2
      ) return;

      card.classList.add('flipped');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        const [first, second] = flippedCards;
        if (first.dataset.value === second.dataset.value) {
          first.classList.add('matched');
          second.classList.add('matched');
          flippedCards = [];
          matchedCount += 2;

          if (matchedCount === memoryItems.length) {
            document.getElementById('message').textContent = 'เย้! จับคู่ครบแล้วววว เบบี๋เก่งที่สุดเลย!';
          }
        } else {
          setTimeout(() => {
            first.classList.remove('flipped');
            second.classList.remove('flipped');
            flippedCards = [];
          }, 1000);
        }
      }
    }

    startGame();
  </script>
</body>
</html>
