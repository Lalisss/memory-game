<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>เกมจับคู่</title>
  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #fff5f7;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #d63384;
    }
    #game {
      display: grid;
      grid-template-columns: repeat(4, 80px);
      grid-gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }
    .card {
      background-color: #ffe6ec;
      border-radius: 12px;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }
    .card.flipped {
      background-color: #ffc0cb;
    }
    .card.matched {
      background-color: #ffd1dc;
      cursor: default;
    }
    #message {
      margin-top: 20px;
      font-size: 1.4rem;
      color: #d63384;
    }
    button {
      margin-top: 20px;
      padding: 0.8rem 1.5rem;
      border: none;
      background-color: #ff8fa3;
      color: white;
      font-size: 1rem;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover {
      background-color: #ff6f91;
    }
  </style>
</head>
<body>

  <h1>เกมจับคู่</h1>
  <div id="game"></div>
  <div id="message"></div>
  <button onclick="startGame()">เริ่มใหม่</button>

  <script>
    const memoryItems = ['🌅','🌅','🍜','🍜','🎡','🎡','🎁','🎁','💬','💬','🎶','🎶','📷','📷','🧸','🧸'];
    let flippedCards = [];
    let matchedCount = 0;

    function startGame() {
      const shuffled = [...memoryItems].sort(() => 0.5 - Math.random());
      const game = document.getElementById('game');
      game.innerHTML = '';
      document.getElementById('message').textContent = '';
      matchedCount = 0;

      shuffled.forEach((item, index) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.value = item;
        card.dataset.index = index;
        card.innerHTML = '';
        card.addEventListener('click', handleCardClick);
        game.appendChild(card);
      });
    }

    function handleCardClick(e) {
      const card = e.target;
      if (card.classList.contains('flipped') || card.classList.contains('matched') || flippedCards.length >= 2) return;

      card.classList.add('flipped');
      card.innerHTML = card.dataset.value;
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        const [first, second] = flippedCards;
        if (first.dataset.value === second.dataset.value) {
          first.classList.add('matched');
          second.classList.add('matched');
          flippedCards = [];
          matchedCount += 2;

          if (matchedCount === memoryItems.length) {
            document.getElementById('message').textContent = 'เย้! คุณจับคู่ครบแล้ว เบบี๋เก่งมากกกก!';
          }
        } else {
          setTimeout(() => {
            first.classList.remove('flipped');
            second.classList.remove('flipped');
            first.innerHTML = '';
            second.innerHTML = '';
            flippedCards = [];
          }, 1000);
        }
      }
    }

    startGame();
  </script>
</body>
</html>
